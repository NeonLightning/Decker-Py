[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "decker-python"
version = "1.12.0"
description = "Linux Python port of the Decker cyberspace RPG"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-2.0-or-later"}
dependencies = [
  "pygame>=2.6",
]

[project.scripts]
decker = "decker.ui:main"

[tool.setuptools.packages.find]
include = ["decker*"]

[tool.setuptools.package-data]
decker = ["bundled/DefaultGraphics/*", "bundled/Sound/*", "bundled/RES/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
